name: Docs

# Fails when a doc is over its size budget, a path under docs/ isn't kebab-case, or a relative
# link points to a file or heading that doesn't exist. Standard: serpcompany/serp
# docs/engineering/standards/agent-harness/docs-are-maps.md.
on:
  # No path filters: these checks take seconds, and a required check must report on every PR.
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Check doc sizes, names and links
        run: npm run docs:check
