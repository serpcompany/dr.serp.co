# ──────────────────────────────────────────────────────────────────────────────
# CUSTOM (MDS)
# ──────────────────────────────────────────────────────────────────────────────

notify = ["zsh", "/Users/devin/.codex/notify.sh"]
model = "gpt-5.2-codex"
model_reasoning_effort = "xhigh"
[tui]
notifications = true


# ──────────────────────────────────────────────────────────────────────────────
# CODEX DEFAULT SETTINGS
# ──────────────────────────────────────────────────────────────────────────────

model = "gpt-5.2-codex"
model_reasoning_effort = "xhigh"

[notice]
"hide_gpt-5.1-codex-max_migration_prompt" = true
hide_full_access_warning = true
hide_rate_limit_model_nudge = true

[notice.model_migrations]
"gpt-5.2" = "gpt-5.2-codex"

[features]
unified_exec = true
shell_snapshot = true


# ──────────────────────────────────────────────────────────────────────────────
# MCP SERVERS
# ──────────────────────────────────────────────────────────────────────────────

[mcp_servers.cloudflare_docs]
command = "npx"
args = ["mcp-remote", "https://docs.mcp.cloudflare.com/sse"]
enabled = true

[mcp_servers.cloudflare_browser]
command = "npx"
args = ["mcp-remote", "https://browser.mcp.cloudflare.com/sse"]
enabled = true

[mcp_servers.chrome_devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest"]
enabled = true

[mcp_servers.eslint]
command = "npx"
args = ["@eslint/mcp@latest"]
enabled = true

[mcp_servers.next_devtools]
command = "npx"
args = ["-y", "next-devtools-mcp@latest"]
enabled = true

[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@latest", "--extension"]
enabled = true

[mcp_servers.playwright.env]
PLAYWRIGHT_MCP_EXTENSION_TOKEN = "zi-L5pFusFmVpQNSc6pW4zPun_ziohtHA7eQnS3WXM0"

[mcp_servers.circuit_web]
command = "npx"
args = ["@snowfort/circuit-web@latest"]
enabled = true

[mcp_servers.upstash_context7]
